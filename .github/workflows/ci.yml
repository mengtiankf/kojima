name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Kojima.slnx

      - name: Build
        run: dotnet build Kojima.slnx -c Release --no-restore

      - name: Core and plugin tests
        run: dotnet test tests/Kojima.Tests/Kojima.Tests.csproj -c Release --no-build

      - name: WPF settings synchronization tests
        run: dotnet test tests/Kojima.Island.Tests/Kojima.Island.Tests.csproj -c Release --no-build
